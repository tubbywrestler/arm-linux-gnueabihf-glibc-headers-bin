name: Sync arm-linux-gnueabihf-glibc-headers-bin

on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      toolchain_ver: ${{ steps.upstream.outputs.toolchain_ver }}
      toolchain_date: ${{ steps.upstream.outputs.toolchain_date }}
      tag: ${{ steps.upstream.outputs.tag }}
      is_new: ${{ steps.exists.outputs.is_new }}
    steps:
      # ARM's own download page has no queryable "latest release" API (it now
      # redirects to a GitLab project with no tags/releases published). The
      # actively-maintained AUR proxy package tracks ARM's releases faithfully
      # and gives a clean version signal - used only as a signal, not as the
      # source: the actual tarball is still fetched directly from ARM below.
      - name: Read upstream ARM toolchain version (via AUR proxy)
        id: upstream
        run: |
          git clone --depth 1 https://aur.archlinux.org/arm-gnu-toolchain-arm-none-linux-gnueabihf-bin.git aur-proxy
          cd aur-proxy
          source PKGBUILD
          echo "toolchain_ver=$_pkgver" >> "$GITHUB_OUTPUT"
          echo "toolchain_date=$_pkgdate" >> "$GITHUB_OUTPUT"
          echo "tag=${_pkgver}.${_pkgdate}-1" >> "$GITHUB_OUTPUT"

      # Idempotency via "does a release for this tag already exist" (same
      # technique as aur-bin-chicken), not "does our committed PKGBUILD
      # already match upstream" - the latter false-positives on the very
      # first run whenever the PKGBUILD happens to be pre-filled with
      # whatever the current version already was.
      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.upstream.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap git and GitHub CLI
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git github-cli

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: bin-repo

      - name: Bump toolchain version, sanity-build, compute real checksum
        env:
          NEW_VER: ${{ needs.check.outputs.toolchain_ver }}
          NEW_DATE: ${{ needs.check.outputs.toolchain_date }}
        run: |
          cd bin-repo
          sed -i "s/^_toolchain_ver=.*/_toolchain_ver=${NEW_VER}/" PKGBUILD
          sed -i "s/^_toolchain_date=.*/_toolchain_date=${NEW_DATE}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD
          # makepkg needs write access to the directory (for src/, pkg/, the
          # built package) plus PKGBUILD/.SRCINFO. Use chmod, not chown -R -
          # changing ownership of the worktree top-level directory makes git
          # treat it as "dubious ownership" and refuse the next (root) step's
          # plain git commands with the confusingly-unrelated error
          # "fatal: not in a git directory".
          chmod o+w . PKGBUILD .SRCINFO
          # Pre-download the tarball ourselves rather than letting makepkg's
          # own downloader (curl ... -C - --retry 3) fetch it: -C - (resume)
          # combined with a retry after a transient mid-transfer network
          # hiccup can silently produce a corrupted file with no error if the
          # retry lands on a different CDN edge - confirmed by hand (repeated
          # plain `curl -fL` downloads of this same URL were always
          # byte-identical; every makepkg-driven download of it was not).
          # makepkg looks for an already-present source file next to the
          # PKGBUILD before trying to download anything, so this is skipped
          # entirely once the file is here.
          _tarball_name="arm-gnu-toolchain-${NEW_VER}-x86_64-arm-none-linux-gnueabihf.tar.xz"
          curl -fL --retry 5 --retry-delay 3 -o "$_tarball_name" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${NEW_VER}/binrel/${_tarball_name}"
          chmod o+w "$_tarball_name"
          # Hash the actual downloaded source tarball here, before building -
          # sha256sums=() belongs to source=(), not to makepkg's build output.
          # (Previously this hashed the built .pkg.tar.zst by mistake, which
          # differs every run since it embeds a build timestamp - misread as
          # download corruption before the real bug was found.)
          sha=$(sha256sum "$_tarball_name" | awk '{print $1}')
          sed -i "s/^sha256sums=.*/sha256sums=('${sha}')/" PKGBUILD
          # --nodeps: sibling toolchain packages (binutils/glibc/glibc-headers)
          # aren't installed in this container - this is a packaging sanity
          # check (does our split/package() still work against this release),
          # not a full dependency-satisfied build. makepkg will also now
          # validate the checksum we just wrote, as a bonus sanity check.
          su builder -c "makepkg --nodeps"
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

      - name: Publish release (changelog/visibility only - not used for idempotency)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bin-repo
          artifact=$(ls *.pkg.tar.zst | grep -v -- '-debug-' | head -n1)
          gh release create "${{ needs.check.outputs.tag }}" "$artifact" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.check.outputs.tag }}" \
            --notes "Tracks ARM's official GNU toolchain release ${{ needs.check.outputs.tag }}"

      - name: Commit and push bump
        run: |
          cd bin-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "${{ needs.check.outputs.tag }}"
            git push
          fi

      - name: Update aur branch (flat files only, for AUR push)
        run: |
          cd bin-repo
          # Same technique as aur-bin-chicken: AUR rejects any push containing
          # a subdirectory (.github/ here), and separately rejects
          # non-fast-forward pushes to master - so this branch must be built
          # incrementally on top of whatever it already contains, never
          # regenerated as a fresh orphan after the first run.
          if git ls-remote --exit-code --heads origin aur >/dev/null 2>&1; then
            git fetch origin aur
            git checkout -B aur origin/aur
          else
            git checkout --orphan aur
            git rm -rf --cached . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null
          fi
          for f in PKGBUILD .SRCINFO .gitignore; do
            git checkout master -- "$f" 2>/dev/null || true
          done
          # Explicit add, not -A: this repo also has the downloaded
          # toolchain tarball (128MB) and makepkg build output sitting in
          # the same directory - a blanket `git add -A` would try to commit
          # those too, and GitHub flatly rejects anything over 100MB.
          git add PKGBUILD .SRCINFO .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "${{ needs.check.outputs.tag }}"
            git push origin aur
          fi
          git checkout master
